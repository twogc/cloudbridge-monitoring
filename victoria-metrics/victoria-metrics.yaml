apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: cloudbridge-monitoring
  labels:
    app: victoria-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      containers:
      - name: victoria-metrics
        image: victoriametrics/victoria-metrics:v1.95.1
        ports:
        - containerPort: 8428
          name: http
        args:
          - '--storageDataPath=/victoria-metrics-data'
          - '--retentionPeriod=180d'
          - '--httpListenAddr=:8428'
          - '--maxConcurrentInserts=4'
          - '--maxInsertRequestSize=33554432'
          - '--search.maxQueryLen=10000'
          - '--search.maxQueryDuration=30s'
          - '--search.maxMemoryPerQuery=1000000000'
          - '--search.maxPointsPerSeries=30000'
          - '--search.maxSeries=1000000'
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        volumeMounts:
        - name: victoria-metrics-storage
          mountPath: /victoria-metrics-data
        livenessProbe:
          httpGet:
            path: /health
            port: 8429
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8429
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: victoria-metrics-storage
        persistentVolumeClaim:
          claimName: victoria-metrics-storage
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: cloudbridge-monitoring
  labels:
    app: victoria-metrics
spec:
  selector:
    app: victoria-metrics
  ports:
  - port: 8428
    targetPort: 8428
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-metrics-storage
  namespace: cloudbridge-monitoring
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
