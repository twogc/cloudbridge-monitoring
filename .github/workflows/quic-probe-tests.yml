name: QUIC Probe Tests

on:
  push:
    paths:
      - 'exporters/**'
  pull_request:
    paths:
      - 'exporters/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.3', '1.24.8']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
    
    - name: Install dependencies
      run: |
        cd exporters
        go mod download
        go mod verify
    
    - name: Run tests with race detection
      run: |
        cd exporters
        go test -race -v ./...
    
    - name: Run benchmarks
      run: |
        cd exporters
        go test -bench=. -benchmem ./...
    
    - name: Check for data races
      run: |
        cd exporters
        go test -race -count=10 ./...
    
    - name: Build binary
      run: |
        cd exporters
        CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o quic-probe .
    
    - name: Test binary
      run: |
        cd exporters
        ./quic-probe --help || true
        timeout 10s ./quic-probe -targets=localhost:443 -interval=1s -port=8080 || true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.3'
        cache: true
    
    - name: Run Go security check
      run: |
        cd exporters
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
    
    - name: Run static analysis
      run: |
        cd exporters
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...
    
    - name: Run gosec security scanner
      run: |
        cd exporters
        go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
        gosec ./...

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build QUIC probe image
      run: |
        cd exporters
        docker build -f Dockerfile.quic-probe -t cloudbridge/quic-probe:latest .
        docker tag cloudbridge/quic-probe:latest cloudbridge/quic-probe:${{ github.sha }}
    
    - name: Test image
      run: |
        cd exporters
        docker run --rm cloudbridge/quic-probe:latest --help || true
        timeout 10s docker run --rm cloudbridge/quic-probe:latest -targets=localhost:443 -interval=1s -port=8080 || true
    
    - name: Push to registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Pushing to registry..."
        # Здесь можно добавить push в registry
