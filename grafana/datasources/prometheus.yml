apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cloudbridge-monitoring
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cloudbridge-relay
data:
  prometheus.yml: |
    apiVersion: 1
    
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus.cloudbridge-monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true
      editable: true
      jsonData:
        httpMethod: POST
        queryTimeout: 60s
        timeInterval: 5s
      version: 1
      
    - name: Alertmanager
      type: alertmanager
      url: http://alertmanager.cloudbridge-monitoring.svc.cluster.local:9093
      access: proxy
      editable: true
      jsonData:
        implementation: prometheus
      version: 1
