---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrubbing-exporter
  namespace: cloudbridge-scrubbing
  labels:
    app: scrubbing-exporter
    app.kubernetes.io/name: scrubbing-exporter
    app.kubernetes.io/part-of: cloudbridge-monitoring
    app.kubernetes.io/component: ddos-protection
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scrubbing-exporter
  template:
    metadata:
      labels:
        app: scrubbing-exporter
        app.kubernetes.io/name: scrubbing-exporter
        app.kubernetes.io/part-of: cloudbridge-monitoring
    spec:
      serviceAccountName: scrubbing-controller
      containers:
      - name: scrubbing-exporter
        image: cloudbridge/scrubbing-exporter:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        env:
        - name: YANDEX_CLOUD_ENABLED
          value: "true"
        - name: QRATOR_ENABLED
          value: "true"
        - name: RTK_ENABLED
          value: "false"
        envFrom:
        - secretRef:
            name: scrubbing-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scrubbing-exporter
  namespace: cloudbridge-scrubbing
  labels:
    app: scrubbing-exporter
    app.kubernetes.io/name: scrubbing-exporter
    app.kubernetes.io/part-of: cloudbridge-monitoring
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: scrubbing-exporter
