---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgp-blackhole-exporter
  namespace: cloudbridge-scrubbing
  labels:
    app: bgp-blackhole-exporter
    app.kubernetes.io/name: bgp-blackhole-exporter
    app.kubernetes.io/part-of: cloudbridge-monitoring
    app.kubernetes.io/component: ddos-protection
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bgp-blackhole-exporter
  template:
    metadata:
      labels:
        app: bgp-blackhole-exporter
        app.kubernetes.io/name: bgp-blackhole-exporter
        app.kubernetes.io/part-of: cloudbridge-monitoring
    spec:
      serviceAccountName: scrubbing-controller
      containers:
      - name: bgp-blackhole-exporter
        image: cloudbridge/bgp-blackhole-exporter:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        env:
        - name: GOBGP_ADDR
          value: "gobgp.cloudbridge-dns-network:50051"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bgp-blackhole-exporter
  namespace: cloudbridge-scrubbing
  labels:
    app: bgp-blackhole-exporter
    app.kubernetes.io/name: bgp-blackhole-exporter
    app.kubernetes.io/part-of: cloudbridge-monitoring
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: webhook
    port: 8081
    targetPort: 8080
    protocol: TCP
  selector:
    app: bgp-blackhole-exporter
