global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@2gc.ru'
  smtp_auth_username: 'alerts@2gc.ru'
  smtp_auth_password: 'your-app-password'
  smtp_require_tls: true

# Конфигурация маршрутизации алертов
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
  # Критические алерты - немедленная отправка
  - match:
      severity: critical
    receiver: 'critical-alerts'
    group_wait: 5s
    repeat_interval: 30m
  
  # Предупреждения - группировка по 5 минут
  - match:
      severity: warning
    receiver: 'warning-alerts'
    group_wait: 5m
    repeat_interval: 2h
  
  # SLO алерты - отдельная обработка
  - match:
      slo: ".*"
    receiver: 'slo-alerts'
    group_wait: 2m
    repeat_interval: 1h

# Получатели уведомлений
receivers:
# Webhook для интеграции с внешними системами
- name: 'web.hook'
  webhook_configs:
  - url: 'http://webhook:5001/'
    send_resolved: true
    title: 'CloudBridge Alert: {{ .GroupLabels.alertname }}'
    text: |
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Severity: {{ .Labels.severity }}
      {{ if .Labels.slo }}SLO: {{ .Labels.slo }}{{ end }}
      {{ end }}

# Критические алерты - email + Slack
- name: 'critical-alerts'
  email_configs:
  - to: 'admin@2gc.ru'
    subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
    body: |
      {{ range .Alerts }}
      🚨 CRITICAL ALERT
      
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Severity: {{ .Labels.severity }}
      Instance: {{ .Labels.instance }}
      {{ if .Labels.slo }}SLO: {{ .Labels.slo }}{{ end }}
      
      Time: {{ .StartsAt }}
      {{ end }}
    headers:
      X-Priority: '1'
      X-MSMail-Priority: 'High'
  
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    channel: '#alerts-critical'
    title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
    text: |
      {{ range .Alerts }}
      🚨 *CRITICAL ALERT*
      
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      *Severity:* {{ .Labels.severity }}
      *Instance:* {{ .Labels.instance }}
      {{ if .Labels.slo }}*SLO:* {{ .Labels.slo }}{{ end }}
      
      *Time:* {{ .StartsAt }}
      {{ end }}

# Предупреждения - email
- name: 'warning-alerts'
  email_configs:
  - to: 'team@2gc.ru'
    subject: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
    body: |
      {{ range .Alerts }}
      ⚠️ WARNING ALERT
      
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Severity: {{ .Labels.severity }}
      Instance: {{ .Labels.instance }}
      {{ if .Labels.slo }}SLO: {{ .Labels.slo }}{{ end }}
      
      Time: {{ .StartsAt }}
      {{ end }}

# SLO алерты - специальная обработка
- name: 'slo-alerts'
  email_configs:
  - to: 'slo-team@2gc.ru'
    subject: '📊 SLO Alert: {{ .GroupLabels.alertname }}'
    body: |
      {{ range .Alerts }}
      📊 SLO ALERT
      
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      SLO: {{ .Labels.slo }}
      Profile: {{ .Labels.profile }}
      Severity: {{ .Labels.severity }}
      
      Time: {{ .StartsAt }}
      {{ end }}
  
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    channel: '#slo-monitoring'
    title: '📊 SLO Alert: {{ .GroupLabels.alertname }}'
    text: |
      {{ range .Alerts }}
      📊 *SLO ALERT*
      
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      *SLO:* {{ .Labels.slo }}
      *Profile:* {{ .Labels.profile }}
      *Severity:* {{ .Labels.severity }}
      
      *Time:* {{ .StartsAt }}
      {{ end }}

# Ингибирование алертов (подавление связанных алертов)
inhibit_rules:
# Подавлять warning алерты при наличии critical
- source_match:
    severity: 'critical'
  target_match:
    severity: 'warning'
  equal: ['alertname', 'cluster', 'service']

# Подавлять SLO алерты при наличии критических системных алертов
- source_match:
    severity: 'critical'
    alertname: 'PrometheusDown'
  target_match:
    slo: '.*'
  equal: ['cluster']
