apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: cloudbridge-monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: cloudbridge-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.25.0
        args:
          - '--config.file=/etc/alertmanager/alertmanager.yml'
          - '--storage.path=/alertmanager'
          - '--web.external-url=http://alertmanager.cloudbridge-monitoring.svc.cluster.local:9093'
          - '--web.route-prefix=/'
          - '--log.level=info'
        ports:
        - containerPort: 9093
          name: web
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        - name: alertmanager-storage
          mountPath: /alertmanager
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config
      - name: alertmanager-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: cloudbridge-monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: cloudbridge-relay
spec:
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093
    protocol: TCP
    name: web
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: cloudbridge-monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: cloudbridge-relay
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'alerts@2gc.ru'
      smtp_auth_username: 'alerts@2gc.ru'
      smtp_auth_password: 'your-app-password'
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
        group_wait: 5s
        repeat_interval: 30m
      
      - match:
          severity: warning
        receiver: 'warning-alerts'
        group_wait: 5m
        repeat_interval: 2h
      
      - match:
          slo: ".*"
        receiver: 'slo-alerts'
        group_wait: 2m
        repeat_interval: 1h

    receivers:
    - name: 'web.hook'
      webhook_configs:
      - url: 'http://webhook:5001/'
        send_resolved: true
        title: 'CloudBridge Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          {{ if .Labels.slo }}SLO: {{ .Labels.slo }}{{ end }}
          {{ end }}

    - name: 'critical-alerts'
      email_configs:
      - to: 'admin@2gc.ru'
        subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          🚨 CRITICAL ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          {{ if .Labels.slo }}SLO: {{ .Labels.slo }}{{ end }}
          
          Time: {{ .StartsAt }}
          {{ end }}

    - name: 'warning-alerts'
      email_configs:
      - to: 'team@2gc.ru'
        subject: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          ⚠️ WARNING ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          {{ if .Labels.slo }}SLO: {{ .Labels.slo }}{{ end }}
          
          Time: {{ .StartsAt }}
          {{ end }}

    - name: 'slo-alerts'
      email_configs:
      - to: 'slo-team@2gc.ru'
        subject: '📊 SLO Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          📊 SLO ALERT
          
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          SLO: {{ .Labels.slo }}
          Profile: {{ .Labels.profile }}
          Severity: {{ .Labels.severity }}
          
          Time: {{ .StartsAt }}
          {{ end }}

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'cluster', 'service']
