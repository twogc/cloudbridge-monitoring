# NetworkPolicies для CloudBridge Monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-netpol
  namespace: cloudbridge-monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Разрешить доступ только от Grafana
  - from:
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 9090
  # Разрешить доступ от node-exporter, kube-state-metrics
  - from:
    - podSelector:
        matchLabels:
          app: node-exporter
    - podSelector:
        matchLabels:
          app: kube-state-metrics
    - podSelector:
        matchLabels:
          app: blackbox-exporter
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Разрешить исходящие соединения к targets
  - to: []
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8084
    - protocol: TCP
      port: 7934
    - protocol: TCP
      port: 9100
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 9115
  # Разрешить доступ к VictoriaMetrics
  - to:
    - podSelector:
        matchLabels:
          app: victoria-metrics
    ports:
    - protocol: TCP
      port: 8429
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-netpol
  namespace: cloudbridge-monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Разрешить доступ к Grafana
  - from: []
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Разрешить доступ к Prometheus
  - to:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090
  # Разрешить доступ к Alertmanager
  - to:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9093
  # Разрешить доступ к PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Разрешить доступ к внешним OIDC провайдерам
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-netpol
  namespace: cloudbridge-monitoring
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Разрешить доступ только от Prometheus
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9093
  # Разрешить доступ к кластеру Alertmanager
  - from:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9094
  egress:
  # Разрешить исходящие соединения к SMTP
  - to: []
    ports:
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 465
  # Разрешить исходящие соединения к Slack
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Разрешить исходящие соединения к webhook
  - to: []
    ports:
    - protocol: TCP
      port: 5001
  # Разрешить доступ к кластеру Alertmanager
  - to:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9094
---
