---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scrubbing-controller
  namespace: cloudbridge-scrubbing
  labels:
    app.kubernetes.io/name: scrubbing-controller
    app.kubernetes.io/part-of: cloudbridge-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scrubbing-controller
  labels:
    app.kubernetes.io/name: scrubbing-controller
    app.kubernetes.io/part-of: cloudbridge-monitoring
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scrubbing-controller
  labels:
    app.kubernetes.io/name: scrubbing-controller
    app.kubernetes.io/part-of: cloudbridge-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scrubbing-controller
subjects:
- kind: ServiceAccount
  name: scrubbing-controller
  namespace: cloudbridge-scrubbing
---
# Secrets для API ключей (заполнить base64-encoded значения)
apiVersion: v1
kind: Secret
metadata:
  name: scrubbing-secrets
  namespace: cloudbridge-scrubbing
  labels:
    app.kubernetes.io/name: scrubbing-secrets
    app.kubernetes.io/part-of: cloudbridge-monitoring
type: Opaque
data:
  # Заполнить актуальными значениями:
  # echo -n "your-api-key" | base64
  QRATOR_API_KEY: ""
  RTK_API_KEY: ""
  YANDEX_CLOUD_API_KEY: ""
  YANDEX_CLOUD_SERVICE_ACCOUNT_KEY: ""
