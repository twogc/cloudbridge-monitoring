---
# Allow Prometheus to scrape scrubbing-exporter
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-scrubbing
  namespace: cloudbridge-scrubbing
spec:
  podSelector:
    matchLabels:
      app: scrubbing-exporter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8080
---
# Allow Prometheus to scrape bgp-blackhole-exporter
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-blackhole
  namespace: cloudbridge-scrubbing
spec:
  podSelector:
    matchLabels:
      app: bgp-blackhole-exporter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8080
---
# Allow Alertmanager to send webhooks to bgp-blackhole-exporter
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-webhook-blackhole
  namespace: cloudbridge-scrubbing
spec:
  podSelector:
    matchLabels:
      app: bgp-blackhole-exporter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-monitoring
      podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 8080
---
# Allow Alertmanager to send webhooks to scrubbing-exporter
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-webhook-scrubbing
  namespace: cloudbridge-scrubbing
spec:
  podSelector:
    matchLabels:
      app: scrubbing-exporter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-monitoring
      podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 8080
---
# Allow bgp-blackhole-exporter to access GoBGP in dns-network namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gobgp-access
  namespace: cloudbridge-scrubbing
spec:
  podSelector:
    matchLabels:
      app: bgp-blackhole-exporter
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-dns-network
      podSelector:
        matchLabels:
          app: gobgp
    ports:
    - protocol: TCP
      port: 50051  # GoBGP gRPC API
---
# Allow DNS queries
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: cloudbridge-scrubbing
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
