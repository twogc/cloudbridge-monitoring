# External Secrets для CloudBridge Monitoring
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: cloudbridge-monitoring
spec:
  provider:
    vault:
      server: "https://vault.2gc.ru:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cloudbridge-monitoring"
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-cluster-secret-store
spec:
  provider:
    vault:
      server: "https://vault.2gc.ru:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cloudbridge-monitoring"
          serviceAccountRef:
            name: external-secrets
            namespace: cloudbridge-monitoring
---
# External Secret для SMTP
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp-secret
  namespace: cloudbridge-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: alertmanager-smtp-secret
    creationPolicy: Owner
  data:
  - secretKey: smtp-username
    remoteRef:
      key: alertmanager
      property: smtp-username
  - secretKey: smtp-password
    remoteRef:
      key: alertmanager
      property: smtp-password
---
# External Secret для Slack
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-secret
  namespace: cloudbridge-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: alertmanager-slack-secret
    creationPolicy: Owner
  data:
  - secretKey: slack-webhook-url
    remoteRef:
      key: alertmanager
      property: slack-webhook-url
---
# External Secret для Grafana OIDC
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-oidc-secret
  namespace: cloudbridge-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: grafana-oidc-secret
    creationPolicy: Owner
  data:
  - secretKey: client-id
    remoteRef:
      key: grafana
      property: oidc-client-id
  - secretKey: client-secret
    remoteRef:
      key: grafana
      property: oidc-client-secret
---
# External Secret для Grafana DB
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-db-secret
  namespace: cloudbridge-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: grafana-db-secret
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      key: grafana
      property: db-password
---
# ServiceAccount для External Secrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: cloudbridge-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["external-secrets.io"]
  resources: ["externalsecrets", "secretstores", "clustersecretstores"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: cloudbridge-monitoring
