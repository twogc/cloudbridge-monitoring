# NetworkPolicies для CloudBridge Monitoring - Исправленная версия
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-netpol
  namespace: cloudbridge-monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Разрешить доступ только от Grafana
  - from:
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 9090
  # Разрешить доступ от экспортеров
  - from:
    - podSelector:
        matchLabels:
          app: node-exporter
    - podSelector:
        matchLabels:
          app: kube-state-metrics
    - podSelector:
        matchLabels:
          app: blackbox-exporter
    - podSelector:
        matchLabels:
          app: quic-probe
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Разрешить исходящие соединения к VictoriaMetrics
  - to:
    - podSelector:
        matchLabels:
          app: victoria-metrics
    ports:
    - protocol: TCP
      port: 8428
  # Разрешить исходящие соединения к targets в том же namespace
  - to:
    - podSelector:
        matchLabels:
          app: node-exporter
    - podSelector:
        matchLabels:
          app: kube-state-metrics
    - podSelector:
        matchLabels:
          app: blackbox-exporter
    - podSelector:
        matchLabels:
          app: quic-probe
    ports:
    - protocol: TCP
      port: 9100
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8083
    - protocol: TCP
      port: 8084
  # Разрешить scraping Edge PoPs в cloudbridge-relay namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-relay
      podSelector:
        matchLabels:
          app: cloudbridge-relay
    ports:
    - protocol: TCP
      port: 5551
  # Разрешить scraping control-plane сервисов в cloudbridge namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge
      podSelector:
        matchLabels:
          app: cadence
    - namespaceSelector:
        matchLabels:
          name: cloudbridge
      podSelector:
        matchLabels:
          app: cloudbridge-relay
    - namespaceSelector:
        matchLabels:
          name: cloudbridge
      podSelector:
        matchLabels:
          app: ai-service
    ports:
    - protocol: TCP
      port: 7934
    - protocol: TCP
      port: 8083
    - protocol: TCP
      port: 8084
  # Разрешить DNS lookups
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Разрешить доступ к Kubernetes API
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          component: apiserver
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-netpol
  namespace: cloudbridge-monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Разрешить доступ от внешних пользователей
  - from: []
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Разрешить исходящие соединения к Prometheus
  - to:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090
  # Разрешить исходящие соединения к Alertmanager
  - to:
    - podSelector:
        matchLabels:
          app: alertmanager
    ports:
    - protocol: TCP
      port: 9093
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-netpol
  namespace: cloudbridge-monitoring
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Разрешить доступ от Prometheus
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9093
  egress:
  # Разрешить исходящие соединения к внешним сервисам уведомлений
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 465
    - protocol: TCP
      port: 25
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-metrics-netpol
  namespace: cloudbridge-monitoring
spec:
  podSelector:
    matchLabels:
      app: victoria-metrics
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Разрешить доступ от Prometheus
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8428
  egress:
  # VictoriaMetrics не нуждается в исходящих соединениях
  - to: []
    ports: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exporters-netpol
  namespace: cloudbridge-monitoring
spec:
  podSelector:
    matchLabels:
      app: node-exporter
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Разрешить доступ от Prometheus
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9100
  egress:
  # Экспортеры не нуждаются в исходящих соединениях
  - to: []
    ports: []
